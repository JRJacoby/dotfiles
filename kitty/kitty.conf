# fonts
font_family      JetBrainsMono Nerd Font
font_size        12
disable_ligatures cursor

# shell integration — prompt marks, clickable paths, scrollback pager, etc.
shell_integration enabled

# aesthetics
background_opacity       0.92
dynamic_background_opacity yes

# scrollback
scrollback_lines         20000
scrollback_pager         nvim -c "silent write! /tmp/kitty_scrollback" -c "te cat /tmp/kitty_scrollback" -

# behavior
enable_audio_bell        no
copy_on_select           yes
strip_trailing_spaces    smart

# using tmux for layouts — hide kitty's own tab bar entirely
tab_bar_style            hidden

# theme — run `kitten themes` to pick one; it auto-appends an include line below


# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME