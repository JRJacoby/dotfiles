[mgr]
ratio = [1, 3, 4]

# Cap preview dimensions so yazi's resize pipeline doesn't stall on
# multi-megapixel scientific plots (e.g. 2346x1391 from matplotlib savefig).
[preview]
max_width     = 1920
max_height    = 1920
image_quality = 80


# xdg-open is not installed on O2, but gio (from glib) is and does the same job.
# setsid -f detaches the launched GUI app from yazi's process tree so yazi
# doesn't track it as an "unfinished task" and pester on quit.
[opener]
open = [
  { run = 'setsid -f gio open "$@" >/dev/null 2>&1', desc = "Open (gio)", orphan = true },
]
play = [
  { run = 'setsid -f ffplay -autoexit -loglevel error "$@" >/dev/null 2>&1', desc = "Play (ffplay)", orphan = true },
]

# CSVs: libmagic reports them as application/csv (not text/csv) on this system,
# so match by that mime and by filename. Route previews to built-in `code`
# (syntax-highlighted text) and Enter to $EDITOR.
[plugin]
prepend_previewers = [
  { mime = "application/csv",               run = "code" },
  { mime = "text/csv",                      run = "code" },
  { mime = "text/tab-separated-values",     run = "code" },
  { name = "*.csv",                         run = "code" },
  { name = "*.tsv",                         run = "code" },
]

[open]
prepend_rules = [
  # CSVs → edit in $EDITOR
  { mime = "application/csv",               use = [ "edit", "open" ] },
  { mime = "text/csv",                      use = [ "edit", "open" ] },
  { mime = "text/tab-separated-values",     use = [ "edit", "open" ] },
  { name = "*.csv",                         use = [ "edit", "open" ] },
  { name = "*.tsv",                         use = [ "edit", "open" ] },
  # Videos → ffplay (fall back to gio open if ffplay can't handle it)
  { mime = "video/*",                       use = [ "play", "open" ] },
]
