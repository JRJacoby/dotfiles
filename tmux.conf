set -g mouse on
set -sg escape-time 0
set -g set-clipboard on

# truecolor: tell tmux the outer terminal (kitty, modern xterm, etc.) supports RGB
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",*256col*:RGB"

# allow kitty graphics protocol (yazi image previews, kitten icat, etc.) to reach the outer terminal
# allow-passthrough requires tmux 3.3+; %if + #{>=:} gates it so older tmux (e.g. Ubuntu 22.04 ships 3.2a) still parses cleanly
%if "#{>=:#{version},3.3}"
set -g allow-passthrough on
%endif
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-yank'

# Tokyo Night theme — matches kitty theme
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @theme_variation 'moon'
# Only these modules in the right status bar. CPU/RAM are bogus on cluster
# compute nodes (shared hardware, cgroup limits) so we exclude them.
set -g @powerkit_plugins 'datetime,hostname,git'

setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Toggle synchronize-panes
bind S setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"

unbind-key C-b
# Login nodes: Ctrl+a prefix (outer tmux for srun sessions)
# Compute nodes: Ctrl+Space prefix (inner tmux)
if-shell 'hostname -s | rg -q "^login"' \
  'set-option -g prefix C-a; bind-key C-a send-prefix' \
  'set-option -g prefix C-Space; bind-key C-Space send-prefix'

bind-key C-y run-shell "tmux send-keys 'pwd' C-m; sleep 0.1; tmux copy-mode; tmux send-keys 'k'; tmux send-keys 'v'; tmux send-keys '0'; tmux send-keys 'y'"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

bind -n M-w run -b "tmux show-buffer | clip.exe"
run '~/.tmux/plugins/tpm/tpm'

# Overrides that must run AFTER plugins load (they set their own defaults)
set -g status-position bottom
set -g pane-border-status top
set -g pane-border-format " #P "
